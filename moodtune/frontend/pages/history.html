<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood History – MoodTune</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<!-- SIDEBAR -->
<aside class="dashboard-sidebar">
  <div class="sidebar-logo">
    <div style="width:32px;height:32px;background:var(--gradient-main);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;">🎵</div>
    <span style="font-family:var(--font-heading);font-weight:800;font-size:1.15rem;" class="gradient-text">MoodTune</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">Main</div>
    <a href="dashboard.html" class="sidebar-link"><i class="fas fa-home"></i><span class="link-text">Dashboard</span></a>
    <a href="mood.html" class="sidebar-link"><i class="fas fa-brain"></i><span class="link-text">Mood Detect</span></a>
    <a href="music.html" class="sidebar-link"><i class="fas fa-music"></i><span class="link-text">Music</span></a>
    <a href="search.html" class="sidebar-link"><i class="fas fa-search"></i><span class="link-text">Search</span></a>
    <div class="nav-section-label">Library</div>
    <a href="favorites.html" class="sidebar-link"><i class="fas fa-heart"></i><span class="link-text">Favorites</span></a>
    <a href="history.html" class="sidebar-link active"><i class="fas fa-history"></i><span class="link-text">History</span></a>
    <div class="nav-section-label">Account</div>
    <a href="profile.html" class="sidebar-link"><i class="fas fa-user"></i><span class="link-text">Profile</span></a>
    <a href="#" class="sidebar-link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span class="link-text">Logout</span></a>
  </nav>
</aside>

<main class="dashboard-main">

  <div class="mb-4">
    <h1 style="font-size:1.8rem;font-weight:800;margin-bottom:4px;">Mood History 📊</h1>
    <p style="color:var(--text-secondary);">Your emotional journey through music.</p>
  </div>

  <!-- Mood Stats Summary -->
  <div class="row g-3 mb-4" id="moodStatsRow">
    <div class="col-12"><div class="skeleton" style="height:80px;border-radius:16px;"></div></div>
  </div>

  <!-- History Timeline -->
  <div class="glass rounded-4 p-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <h2 style="font-size:1.1rem;font-weight:700;margin:0;">Timeline</h2>
      <span id="historyCount" style="font-size:0.85rem;color:var(--text-muted);"></span>
    </div>
    <div id="historyList">
      <div class="skeleton" style="height:60px;margin-bottom:8px;border-radius:12px;"></div>
      <div class="skeleton" style="height:60px;margin-bottom:8px;border-radius:12px;"></div>
      <div class="skeleton" style="height:60px;margin-bottom:8px;border-radius:12px;"></div>
      <div class="skeleton" style="height:60px;margin-bottom:8px;border-radius:12px;"></div>
      <div class="skeleton" style="height:60px;border-radius:12px;"></div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!Auth.requireAuth()) return;

  document.getElementById('logoutBtn').addEventListener('click', (e) => {
    e.preventDefault();
    Auth.clearSession();
    window.location.href = '../index.html';
  });

  await loadHistory();
});

async function loadHistory() {
  const res = await API.get('/mood/history');
  if (!res?.ok) {
    Toast.error('Failed to load mood history.');
    return;
  }

  const history = res.data.history;
  document.getElementById('historyCount').textContent = `${history.length} entries`;

  // Build stats
  buildMoodStats(history);

  // Build timeline
  buildTimeline(history);
}

function buildMoodStats(history) {
  const counts = {};
  history.forEach(item => {
    counts[item.mood] = (counts[item.mood] || 0) + 1;
  });

  const total = history.length;
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  const statsRow = document.getElementById('moodStatsRow');

  if (sorted.length === 0) {
    statsRow.innerHTML = `
      <div class="col-12">
        <div class="empty-state">
          <div class="empty-state-icon">🎭</div>
          <div class="empty-state-title">No mood data yet</div>
          <div class="empty-state-subtitle"><a href="mood.html" style="color:var(--color-purple-light);">Detect your first mood</a></div>
        </div>
      </div>`;
    return;
  }

  statsRow.innerHTML = sorted.slice(0, 4).map(([mood, count]) => {
    const m = MOODS[mood] || { emoji: '🎵', label: mood, color: 'var(--color-purple)' };
    const pct = total > 0 ? Math.round((count / total) * 100) : 0;
    return `
    <div class="col-6 col-lg-3">
      <div class="stat-card">
        <div style="font-size:2rem;margin-bottom:8px;">${m.emoji}</div>
        <div class="stat-card-value" style="font-size:1.6rem;background:${m.gradient || 'var(--gradient-main)'};-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">${count}</div>
        <div class="stat-card-label">${m.label} (${pct}%)</div>
        <div style="height:3px;background:var(--border-color);border-radius:2px;margin-top:10px;">
          <div style="height:100%;width:${pct}%;background:${m.gradient || 'var(--gradient-main)'};border-radius:2px;transition:width 1s ease;"></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function buildTimeline(history) {
  const el = document.getElementById('historyList');

  if (!history.length) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📅</div>
        <div class="empty-state-title">No mood entries yet</div>
        <div class="empty-state-subtitle">Start by <a href="mood.html" style="color:var(--color-purple-light);">detecting your mood</a></div>
      </div>`;
    return;
  }

  // Group by date
  const grouped = {};
  history.forEach(item => {
    const date = new Date(item.timestamp).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    if (!grouped[date]) grouped[date] = [];
    grouped[date].push(item);
  });

  el.innerHTML = Object.entries(grouped).map(([date, items]) => `
    <div class="mb-4">
      <div style="font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin-bottom:10px;">${date}</div>
      ${items.map(item => {
        const m = MOODS[item.mood] || { emoji: '🎵', label: item.mood };
        const methodIcon = item.detectionMethod === 'ai' ? '🤖' : item.detectionMethod === 'keyword' ? '🔤' : '👆';
        return `
        <div class="history-item" style="cursor:pointer;" onclick="window.location.href='music.html?mood=${item.mood}'">
          <span style="font-size:1.8rem;">${m.emoji}</span>
          <div style="flex:1;">
            <div style="font-weight:600;text-transform:capitalize;">${m.label}</div>
            ${item.inputText ? `<div style="font-size:0.78rem;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;">"${escapeHtml(item.inputText)}"</div>` : ''}
          </div>
          <div style="text-align:right;">
            <div style="font-size:0.75rem;color:var(--text-muted);">${new Date(item.timestamp).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</div>
            <div style="font-size:0.7rem;color:var(--text-muted);margin-top:2px;">${methodIcon}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`).join('');
}
</script>
</body>
</html>
