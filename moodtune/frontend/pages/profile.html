<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile – MoodTune</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<!-- SIDEBAR -->
<aside class="dashboard-sidebar">
  <div class="sidebar-logo">
    <div style="width:32px;height:32px;background:var(--gradient-main);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;">🎵</div>
    <span style="font-family:var(--font-heading);font-weight:800;font-size:1.15rem;" class="gradient-text">MoodTune</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">Main</div>
    <a href="dashboard.html" class="sidebar-link"><i class="fas fa-home"></i><span class="link-text">Dashboard</span></a>
    <a href="mood.html" class="sidebar-link"><i class="fas fa-brain"></i><span class="link-text">Mood Detect</span></a>
    <a href="music.html" class="sidebar-link"><i class="fas fa-music"></i><span class="link-text">Music</span></a>
    <a href="search.html" class="sidebar-link"><i class="fas fa-search"></i><span class="link-text">Search</span></a>
    <div class="nav-section-label">Library</div>
    <a href="favorites.html" class="sidebar-link"><i class="fas fa-heart"></i><span class="link-text">Favorites</span></a>
    <a href="history.html" class="sidebar-link"><i class="fas fa-history"></i><span class="link-text">History</span></a>
    <div class="nav-section-label">Account</div>
    <a href="profile.html" class="sidebar-link active"><i class="fas fa-user"></i><span class="link-text">Profile</span></a>
    <a href="#" class="sidebar-link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span class="link-text">Logout</span></a>
  </nav>
</aside>

<main class="dashboard-main">

  <div class="mb-4">
    <h1 style="font-size:1.8rem;font-weight:800;margin-bottom:4px;">My Profile 👤</h1>
    <p style="color:var(--text-secondary);">Manage your account and see your stats.</p>
  </div>

  <div class="row g-4">

    <!-- Profile Card -->
    <div class="col-lg-4">
      <div class="glass rounded-4 p-4 text-center">
        <!-- Avatar -->
        <div style="width:88px;height:88px;border-radius:50%;background:var(--gradient-main);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;margin:0 auto 16px;" id="profileAvatar">?</div>
        <h2 style="font-size:1.4rem;font-weight:800;margin-bottom:4px;" id="profileName">–</h2>
        <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:4px;" id="profileEmail">–</p>
        <p style="color:var(--text-muted);font-size:0.8rem;margin-bottom:20px;" id="profileJoined">–</p>

        <!-- Edit name -->
        <div id="editNameSection">
          <button class="btn-outline w-100 justify-content-center" onclick="toggleEditName()">
            <i class="fas fa-pen"></i> Edit Name
          </button>
        </div>
        <div id="editNameForm" style="display:none;">
          <input type="text" id="editNameInput" class="form-control mb-2" placeholder="Enter new name">
          <div class="d-flex gap-2">
            <button class="btn-primary flex-1 justify-content-center" style="font-size:0.85rem;" onclick="saveName()">
              <i class="fas fa-check me-1"></i>Save
            </button>
            <button class="btn-ghost flex-1 justify-content-center" onclick="toggleEditName()">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="col-lg-8">
      <div class="row g-3 mb-4">
        <div class="col-6">
          <div class="stat-card">
            <div class="stat-card-icon" style="background:rgba(236,72,153,0.15);color:var(--color-pink);"><i class="fas fa-heart"></i></div>
            <div class="stat-card-value gradient-text" id="profileFavs">–</div>
            <div class="stat-card-label">Favorite Songs</div>
          </div>
        </div>
        <div class="col-6">
          <div class="stat-card">
            <div class="stat-card-icon" style="background:rgba(124,58,237,0.15);color:var(--color-purple-light);"><i class="fas fa-brain"></i></div>
            <div class="stat-card-value gradient-text" id="profileMoodChecks">–</div>
            <div class="stat-card-label">Mood Checks</div>
          </div>
        </div>
      </div>

      <!-- Mood Statistics -->
      <div class="glass rounded-4 p-4">
        <h3 style="font-size:1rem;font-weight:700;margin-bottom:20px;">Mood Breakdown</h3>
        <div id="moodBreakdown">
          <div class="skeleton" style="height:28px;margin-bottom:10px;border-radius:8px;"></div>
          <div class="skeleton" style="height:28px;margin-bottom:10px;border-radius:8px;"></div>
          <div class="skeleton" style="height:28px;border-radius:8px;"></div>
        </div>
      </div>
    </div>

    <!-- Danger Zone -->
    <div class="col-12">
      <div class="glass rounded-4 p-4" style="border-color:rgba(239,68,68,0.2);">
        <h3 style="font-size:1rem;font-weight:700;margin-bottom:16px;color:var(--color-red);">
          <i class="fas fa-exclamation-triangle me-2"></i>Account Actions
        </h3>
        <div class="d-flex gap-3 flex-wrap">
          <button class="btn-ghost" style="border:1px solid rgba(239,68,68,0.3);color:var(--color-red);" onclick="confirmLogout()">
            <i class="fas fa-sign-out-alt me-2"></i>Sign Out
          </button>
        </div>
      </div>
    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>
let profileData = null;

document.addEventListener('DOMContentLoaded', async () => {
  if (!Auth.requireAuth()) return;

  document.getElementById('logoutBtn').addEventListener('click', (e) => {
    e.preventDefault();
    confirmLogout();
  });

  await loadProfile();
});

async function loadProfile() {
  const res = await API.get('/user/profile');
  if (!res?.ok) {
    Toast.error('Failed to load profile.');
    return;
  }

  profileData = res.data;
  const { user, stats } = res.data;

  // Avatar initials
  const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
  document.getElementById('profileAvatar').textContent = initials;

  document.getElementById('profileName').textContent = user.name;
  document.getElementById('profileEmail').textContent = user.email;
  document.getElementById('profileJoined').textContent = `Member since ${formatDate(user.createdAt)}`;

  document.getElementById('profileFavs').textContent = stats.favoritesCount;
  document.getElementById('profileMoodChecks').textContent = stats.totalMoodChecks;

  // Mood breakdown bars
  buildMoodBreakdown(stats.moodStats);
}

function buildMoodBreakdown(moodStats) {
  const el = document.getElementById('moodBreakdown');
  const total = Object.values(moodStats).reduce((a, b) => a + b, 0);

  if (total === 0) {
    el.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:20px;">No mood data yet. <a href="mood.html" style="color:var(--color-purple-light);">Start detecting moods!</a></div>`;
    return;
  }

  const sorted = Object.entries(moodStats).sort((a, b) => b[1] - a[1]);

  el.innerHTML = sorted.map(([mood, count]) => {
    const m = MOODS[mood] || { emoji: '🎵', label: mood, gradient: 'var(--gradient-main)', color: 'var(--color-purple)' };
    const pct = Math.round((count / total) * 100);
    return `
    <div class="mb-3">
      <div class="d-flex align-items-center justify-content-between mb-1">
        <span style="font-size:0.875rem;font-weight:500;">${m.emoji} ${m.label}</span>
        <span style="font-size:0.78rem;color:var(--text-muted);">${count} × (${pct}%)</span>
      </div>
      <div style="height:6px;background:var(--border-color);border-radius:3px;overflow:hidden;">
        <div style="height:100%;width:0%;background:${m.gradient || 'var(--gradient-main)'};border-radius:3px;transition:width 0.8s ease;"></div>
      </div>
    </div>`;
  }).join('');

  // Animate bars after render
  setTimeout(() => {
    sorted.forEach(([mood, count]) => {
      const pct = Math.round((count / total) * 100);
      const bars = el.querySelectorAll('div[style*="width:0%"]');
      bars.forEach(bar => { bar.style.width = pct + '%'; });
    });

    // Re-animate all bars correctly
    const allRows = el.querySelectorAll('.mb-3');
    sorted.forEach(([mood, count], i) => {
      const pct = Math.round((count / total) * 100);
      const bar = allRows[i]?.querySelector('div[style*="border-radius:3px;"]');
      if (bar) bar.style.width = pct + '%';
    });
  }, 100);
}

function toggleEditName() {
  const form = document.getElementById('editNameForm');
  const btn = document.getElementById('editNameSection');
  const isShowing = form.style.display !== 'none';
  form.style.display = isShowing ? 'none' : 'block';
  btn.style.display = isShowing ? 'block' : 'none';
  if (!isShowing) {
    document.getElementById('editNameInput').value = profileData?.user?.name || '';
    document.getElementById('editNameInput').focus();
  }
}

async function saveName() {
  const name = document.getElementById('editNameInput').value.trim();
  if (!name || name.length < 2) {
    Toast.warning('Name must be at least 2 characters.');
    return;
  }

  const res = await API.put('/user/profile', { name });
  if (res?.ok) {
    const user = Auth.getUser();
    if (user) {
      user.name = name;
      localStorage.setItem(CONFIG.USER_KEY, JSON.stringify(user));
    }
    document.getElementById('profileName').textContent = name;
    const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
    document.getElementById('profileAvatar').textContent = initials;
    toggleEditName();
    Toast.success('Name updated successfully!');
  } else {
    Toast.error(res?.data?.message || 'Failed to update name.');
  }
}

function confirmLogout() {
  if (confirm('Are you sure you want to sign out?')) {
    Auth.clearSession();
    window.location.href = '../index.html';
  }
}
</script>
</body>
</html>
