<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search – MoodTune</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<!-- SIDEBAR -->
<aside class="dashboard-sidebar">
  <div class="sidebar-logo">
    <div style="width:32px;height:32px;background:var(--gradient-main);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;">🎵</div>
    <span style="font-family:var(--font-heading);font-weight:800;font-size:1.15rem;" class="gradient-text">MoodTune</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">Main</div>
    <a href="dashboard.html" class="sidebar-link"><i class="fas fa-home"></i><span class="link-text">Dashboard</span></a>
    <a href="mood.html" class="sidebar-link"><i class="fas fa-brain"></i><span class="link-text">Mood Detect</span></a>
    <a href="music.html" class="sidebar-link"><i class="fas fa-music"></i><span class="link-text">Music</span></a>
    <a href="search.html" class="sidebar-link active"><i class="fas fa-search"></i><span class="link-text">Search</span></a>
    <div class="nav-section-label">Library</div>
    <a href="favorites.html" class="sidebar-link"><i class="fas fa-heart"></i><span class="link-text">Favorites</span></a>
    <a href="history.html" class="sidebar-link"><i class="fas fa-history"></i><span class="link-text">History</span></a>
    <div class="nav-section-label">Account</div>
    <a href="profile.html" class="sidebar-link"><i class="fas fa-user"></i><span class="link-text">Profile</span></a>
    <a href="#" class="sidebar-link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span class="link-text">Logout</span></a>
  </nav>
</aside>

<main class="dashboard-main">

  <div class="mb-4">
    <h1 style="font-size:1.8rem;font-weight:800;margin-bottom:4px;">Search Music 🔍</h1>
    <p style="color:var(--text-secondary);">Find any song, artist, or album from Deezer's library.</p>
  </div>

  <!-- Search Bar -->
  <div class="glass rounded-4 p-4 mb-4">
    <div class="search-input-container">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="searchInput" class="search-input"
             placeholder="Search songs, artists, albums..."
             autocomplete="off" maxlength="100">
    </div>
    <!-- Quick search tags -->
    <div class="d-flex flex-wrap gap-2 mt-3" id="quickTags">
      <span style="font-size:0.78rem;color:var(--text-muted);">Trending:</span>
      <button class="quick-tag" data-q="Taylor Swift">Taylor Swift</button>
      <button class="quick-tag" data-q="The Weeknd">The Weeknd</button>
      <button class="quick-tag" data-q="Arijit Singh">Arijit Singh</button>
      <button class="quick-tag" data-q="Ed Sheeran">Ed Sheeran</button>
      <button class="quick-tag" data-q="Drake">Drake</button>
      <button class="quick-tag" data-q="Coldplay">Coldplay</button>
      <button class="quick-tag" data-q="lofi chill">Lofi Chill</button>
    </div>
  </div>

  <!-- Results -->
  <div id="searchResults">
    <div class="empty-state">
      <div class="empty-state-icon">🎵</div>
      <div class="empty-state-title">Start searching</div>
      <div class="empty-state-subtitle">Type a song, artist or album name above</div>
    </div>
  </div>

</main>

<!-- AUDIO PLAYER -->
<div class="audio-player" id="audioPlayer">
  <div class="player-song-info">
    <img src="" class="player-thumb" alt="Now playing">
    <div>
      <div class="player-title">–</div>
      <div class="player-artist">–</div>
    </div>
  </div>
  <div class="player-controls">
    <button class="player-btn" onclick="Player.audio && (Player.audio.currentTime=0)"><i class="fas fa-step-backward"></i></button>
    <button class="player-btn play" onclick="Player.toggle()"><i class="fas fa-play"></i></button>
    <button class="player-btn" onclick="Player.audio && (Player.audio.currentTime=Player.audio.duration||0)"><i class="fas fa-step-forward"></i></button>
  </div>
  <div class="player-progress">
    <span class="time-label" id="currentTime">0:00</span>
    <div class="progress-bar-container"><div class="progress-fill" style="width:0%"></div></div>
    <span class="time-label" id="totalTime">0:30</span>
  </div>
  <button class="player-btn" onclick="document.getElementById('audioPlayer').classList.remove('active');"><i class="fas fa-times"></i></button>
</div>

<style>
.quick-tag {
  padding: 4px 12px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  color: var(--text-secondary);
  font-size: 0.78rem;
  font-family: var(--font-body);
  cursor: pointer;
  transition: var(--transition);
}
.quick-tag:hover {
  background: rgba(124,58,237,0.1);
  border-color: var(--color-purple);
  color: var(--color-purple-light);
}
.results-header {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 16px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>
let searchTimeout;

document.addEventListener('DOMContentLoaded', async () => {
  if (!Auth.requireAuth()) return;

  document.getElementById('logoutBtn').addEventListener('click', (e) => {
    e.preventDefault();
    Auth.clearSession();
    window.location.href = '../index.html';
  });

  await Favorites.load();

  const input = document.getElementById('searchInput');

  // Debounced search on input
  input.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    const q = input.value.trim();
    if (!q) {
      showEmpty();
      return;
    }
    searchTimeout = setTimeout(() => performSearch(q), 500);
  });

  // Enter key
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      clearTimeout(searchTimeout);
      const q = input.value.trim();
      if (q) performSearch(q);
    }
  });

  // Quick tags
  document.querySelectorAll('.quick-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.q;
      performSearch(btn.dataset.q);
    });
  });

  // Check URL for pre-filled query
  const params = new URLSearchParams(window.location.search);
  const q = params.get('q');
  if (q) {
    input.value = q;
    performSearch(q);
  }
});

async function performSearch(query) {
  const container = document.getElementById('searchResults');
  container.innerHTML = `
    <div class="results-header">Searching for "<strong>${escapeHtml(query)}</strong>"...</div>
    <div class="music-grid">
      ${Array(6).fill(`<div class="skeleton" style="height:300px;border-radius:16px;"></div>`).join('')}
    </div>`;

  const res = await API.get(`/music/search?q=${encodeURIComponent(query)}`);

  if (res?.ok) {
    if (res.data.tracks?.length > 0) {
      container.innerHTML = `<div class="results-header">${res.data.tracks.length} results for "<strong>${escapeHtml(query)}</strong>"</div><div class="music-grid" id="searchGrid"></div>`;
      renderMusicCards(res.data.tracks, 'searchGrid', null);
    } else {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">🔍</div>
          <div class="empty-state-title">No results for "${escapeHtml(query)}"</div>
          <div class="empty-state-subtitle">Try a different song, artist, or album name</div>
        </div>`;
    }
  } else {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">⚠️</div>
        <div class="empty-state-title">Search failed</div>
        <div class="empty-state-subtitle">Make sure your backend server is running</div>
      </div>`;
  }
}

function showEmpty() {
  document.getElementById('searchResults').innerHTML = `
    <div class="empty-state">
      <div class="empty-state-icon">🎵</div>
      <div class="empty-state-title">Start searching</div>
      <div class="empty-state-subtitle">Type a song, artist or album name above</div>
    </div>`;
}
</script>
</body>
</html>
