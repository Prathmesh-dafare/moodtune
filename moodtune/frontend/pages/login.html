<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – MoodTune</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
  <!-- Background effects -->
  <div style="position:fixed;inset:0;background:radial-gradient(ellipse at top left,rgba(124,58,237,0.15) 0%,transparent 50%),radial-gradient(ellipse at bottom right,rgba(236,72,153,0.08) 0%,transparent 50%);pointer-events:none;"></div>

  <div class="auth-card" style="position:relative;z-index:1;">
    <!-- Logo -->
    <div class="auth-logo">
      <a href="../index.html" class="d-flex align-items-center gap-2 text-decoration-none">
        <div style="width:36px;height:36px;background:var(--gradient-main);border-radius:8px;display:flex;align-items:center;justify-content:center;">🎵</div>
        <span style="font-family:var(--font-heading);font-size:1.3rem;font-weight:800;" class="gradient-text">MoodTune</span>
      </a>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to discover music that matches your mood.</p>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label"><i class="fas fa-envelope me-2"></i>Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
        <div class="invalid-feedback" id="emailError"></div>
      </div>

      <div class="form-group">
        <label class="form-label d-flex justify-content-between">
          <span><i class="fas fa-lock me-2"></i>Password</span>
          <a href="#" style="font-size:0.8rem;color:var(--color-purple-light);">Forgot password?</a>
        </label>
        <div style="position:relative;">
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password" style="padding-right:48px;">
          <button type="button" id="togglePassword" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="invalid-feedback" id="passwordError"></div>
      </div>

      <button type="submit" class="btn-primary w-100 justify-content-center mt-2" id="submitBtn">
        <span id="btnText"><i class="fas fa-sign-in-alt me-2"></i>Sign In</span>
        <span id="btnLoader" style="display:none;"><span class="loading-spinner"></span></span>
      </button>
    </form>

    <div class="divider">or</div>

    <!-- Demo note -->
    <div class="glass rounded-3 p-3 mb-4 text-center" style="border-color:rgba(124,58,237,0.2);">
      <div style="font-size:0.8rem;color:var(--text-muted);">
        <i class="fas fa-info-circle me-1" style="color:var(--color-purple-light);"></i>
        Don't have an account yet?
      </div>
    </div>

    <p style="text-align:center;color:var(--text-secondary);font-size:0.9rem;">
      New to MoodTune?
      <a href="register.html" style="color:var(--color-purple-light);font-weight:600;">Create an account →</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Redirect if already logged in
  Auth.redirectIfLoggedIn();

  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const btnLoader = document.getElementById('btnLoader');

  // Toggle password visibility
  document.getElementById('togglePassword').addEventListener('click', () => {
    const input = document.getElementById('password');
    const icon = document.querySelector('#togglePassword i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'fas fa-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'fas fa-eye';
    }
  });

  const setLoading = (loading) => {
    submitBtn.disabled = loading;
    btnText.style.display = loading ? 'none' : 'flex';
    btnLoader.style.display = loading ? 'flex' : 'none';
  };

  const clearErrors = () => {
    document.querySelectorAll('.form-control').forEach(el => el.classList.remove('is-invalid'));
    document.querySelectorAll('.invalid-feedback').forEach(el => el.textContent = '');
  };

  const showError = (field, msg) => {
    const input = document.getElementById(field);
    const error = document.getElementById(field + 'Error');
    if (input) input.classList.add('is-invalid');
    if (error) error.textContent = msg;
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Client-side validation
    if (!email) return showError('email', 'Please enter your email.');
    if (!email.includes('@')) return showError('email', 'Please enter a valid email.');
    if (!password) return showError('password', 'Please enter your password.');

    setLoading(true);

    const res = await API.post('/auth/login', { email, password });

    setLoading(false);

    if (res?.ok) {
      Auth.setSession(res.data.token, res.data.user);
      Toast.success(`Welcome back, ${res.data.user.name}! 🎵`);
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 800);
    } else {
      Toast.error(res?.data?.message || 'Login failed. Please try again.');
      showError('email', ' ');
      showError('password', res?.data?.message || 'Invalid credentials.');
    }
  });
});
</script>
</body>
</html>
